name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install integration test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo install "$(command -v node)" /usr/local/bin/node
          sudo npm install --global --prefix /usr/local npm @earendil-works/pi-coding-agent@1.0.0

      - name: Install saved workflow test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/picco-workflow-proof" --ignore-scripts \
            @earendil-works/pi-coding-agent@1.4.0 @tintinweb/pi-subagents@0.22.0
          test -x "$RUNNER_TEMP/picco-workflow-proof/node_modules/.bin/pi"
          test -f "$RUNNER_TEMP/picco-workflow-proof/node_modules/@tintinweb/pi-subagents/dist/index.js"

      - name: Build packages
        run: pnpm build

      - name: Check generated files
        run: git diff --exit-code

      - name: Format check
        run: pnpm fmt:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit test
        run: pnpm test

      - name: Create host Pi config fixture
        run: mkdir -p "$HOME/.pi/agent"

      - name: Integration test
        run: pnpm test:integration
        env:
          PICCO_REQUIRE_BWRAP: "1"
          PICCO_PI_BIN: ${{ runner.temp }}/picco-workflow-proof/node_modules/.bin/pi
          PICCO_SUBAGENTS_EXTENSION: ${{ runner.temp }}/picco-workflow-proof/node_modules/@tintinweb/pi-subagents/dist/index.js

      - name: Smoke tests
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DEFAULT_MODEL: openrouter/deepseek/deepseek-v4.1-flash
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Configure the OPENROUTER_API_KEY repository secret to run smoke tests."
            exit 1
          fi
          pnpm test:smoke:all
